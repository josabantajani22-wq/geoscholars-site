# Refreshes data/vacancies.js from FreeJobAlert every day and re-publishes the site.
name: Update geology vacancies
on:
  schedule:
    - cron: "30 1 * * *"      # 07:00 IST daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 lxml
      - run: python tools/fetch_freejobalert.py --keep-days 30
      - run: python tools/render_static.py
      - name: Commit if changed
        run: |
          git config user.name "gsa-vacancy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/vacancies.js vacancies.html
          git diff --cached --quiet || git commit -m "chore: refresh vacancies $(date -u +%F)"
          git push
