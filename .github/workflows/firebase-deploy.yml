# Deploys the site to Firebase Hosting on every push to main (your own uploads/edits).
# Runner pinned to ubuntu-24.04 + Firebase CLI deploy — see note in vacancies.yml.
name: Deploy to Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm install -g firebase-tools@13
          firebase deploy --only hosting --project geo-scholars-academy-ac558 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
