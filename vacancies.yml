# Daily: FreeJobAlert feed + AI web research (Claude with web search) → data/vacancies.js → commit → deploy to Firebase Hosting.
# (A commit made by the bot does not trigger the separate Deploy workflow — GitHub blocks that — so we deploy here.)
# Runner pinned to ubuntu-24.04 and deploy done with the Firebase CLI directly: the action-hosting-deploy@v0 action broke
# when GitHub moved ubuntu-latest to Ubuntu 26 (19 Oct 2026) → "npx failed with exit code 1".
name: Update geology vacancies
on:
  schedule:
    - cron: "30 1 * * *"      # 07:00 IST daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 lxml anthropic
      - run: python tools/fetch_freejobalert.py --keep-days 30
      - name: AI web research (all government / PSU geology vacancies)   # needs secret ANTHROPIC_API_KEY; skipped if absent
        run: python tools/vacancy_agent.py --keep-days 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
      - run: python tools/render_static.py
      - name: Commit if changed
        run: |
          git config user.name "gsa-vacancy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/vacancies.js vacancies.html index.html admin.html
          git diff --cached --quiet || git commit -m "chore: refresh vacancies $(date -u +%F)"
          git push
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm install -g firebase-tools@13
          firebase deploy --only hosting --project geo-scholars-academy-ac558 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
