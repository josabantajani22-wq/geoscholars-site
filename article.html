<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article — Geo Scholars Academy</title>
<meta name="description" content="Geology exam preparation article from Geo Scholars Academy.">
<link rel="canonical" href="https://geoscholarsacademy.org/article.html"><meta property="og:site_name" content="Geo Scholars Academy"><meta property="og:image" content="https://geoscholarsacademy.org/assets/logo.png"><link rel="icon" href="assets/logo.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1B2229"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<section>
  <div class="wrap article-wrap" id="art"><p class="muted">Loading…</p></div>
</section>
<div id="site-footer"></div>
<script src="js/config.js"></script><script src="data/site.js"></script><script src="data/tests.js"></script><script src="data/vacancies.js"></script><script src="data/articles.js"></script><script src="js/store.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener("gsa:ready", async () => {
  const { esc, fmtDate, qs } = GSA.ui; const a = await GSA.store.getAnyArticle(qs("id") || "");
  const box = document.getElementById("art");
  if (!a) { box.innerHTML = "<h1>Article not found</h1><p><a href='articles.html'>← All articles</a></p>"; return; }
  document.title = a.title + " — Geo Scholars Academy";
  const md = (t) => { const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[(.+?)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>'); const out = []; let list = [];
    const flush = () => { if (list.length) { out.push("<ul>" + list.map(inline).map(x => "<li>" + x + "</li>").join("") + "</ul>"); list = []; } };
    t.split(/\r?\n/).forEach(line => { const l = line.trim(); if (!l) { flush(); return; } if (l.startsWith("## ")) { flush(); out.push("<h2>" + inline(l.slice(3)) + "</h2>"); } else if (l.startsWith("# ")) { flush(); out.push("<h2>" + inline(l.slice(2)) + "</h2>"); } else if (/^[-*] /.test(l)) list.push(l.slice(2)); else { flush(); out.push("<p>" + inline(l) + "</p>"); } }); flush(); return out.join(""); };
  const all = (await GSA.store.listAllArticles()).filter(x => x.id !== a.id).slice(0, 3);
  box.innerHTML = `<p class="small"><a href="articles.html">← All articles</a></p><div class="eyebrow">${(a.tags || []).map(esc).join(" · ") || "Article"}</div><h1>${esc(a.title)}</h1><p class="small muted">${esc(a.author || "Geo Scholars Academy")} · ${fmtDate(a.at || Date.now())}</p><div class="article-body">${md(a.body || "")}</div>${GSA.ui.shareBar(a.title, location.href)}
    <div class="join-card" style="margin-top:2rem"><h3 style="margin-top:0">Want a mentor for this exam?</h3><p>Free full-length mocks are open to everyone; batches for IIT JAM + CUET and GSI · NET · GATE · PSUs are enrolling now.</p><a class="btn primary" href="tests.html">Take a free mock</a> <a class="btn ghost" href="contact.html">Enquire</a></div>
    ${all.length ? "<h3 style='margin-top:2rem'>More articles</h3><ul>" + all.map(x => `<li><a href="article.html?id=${encodeURIComponent(x.slug || x.id)}">${esc(x.title)}</a></li>`).join("") + "</ul>" : ""}`;
  const ld = { "@context": "https://schema.org", "@type": "Article", headline: a.title, description: a.excerpt || "", author: { "@type": "Organization", name: "Geo Scholars Academy" }, publisher: { "@type": "Organization", name: "Geo Scholars Academy", logo: { "@type": "ImageObject", url: "https://geoscholarsacademy.org/assets/logo.png" } }, datePublished: new Date(a.at || Date.now()).toISOString(), mainEntityOfPage: location.href };
  const s = document.createElement("script"); s.type = "application/ld+json"; s.textContent = JSON.stringify(ld); document.head.appendChild(s);
  const m = document.querySelector('meta[name="description"]'); if (m && a.excerpt) m.content = a.excerpt;
});
</script>
</body></html>
